# Install once: `brew install pre-commit && pre-commit install`.
# The ruff rev must stay equal to the ruff version pinned in
# .github/workflows/ci.yml so hooks and CI agree on the default rule set.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts/[^/]+\.sh|scripts/lib/[^/]+\.sh|plugins/skein/skills/review-gauntlet/lib/[^/]+\.sh|plugins/skein(-codex)?/skills/fan-out/fan-out\.sh|tests/[^/]+/[^/]+\.sh)$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        files: ^(scripts/[^/]+\.sh|scripts/lib/[^/]+\.sh|plugins/skein/skills/review-gauntlet/lib/[^/]+\.sh|plugins/skein(-codex)?/skills/fan-out/fan-out\.sh|tests/[^/]+/[^/]+\.sh)$
